<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dave Rhoden's Task Tracker</title>
  </head>
  <body>
    <!-- Include the script that builds the page and powers Decap CMS -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>

    <script type="module" src="/admin/preview-templates/index.js"></script>
    <script>
    (function() {
      var knownPosts = [];

      fetch('/post-slugs.json')
        .then(function(r) { return r.json(); })
        .then(function(posts) { knownPosts = posts; })
        .catch(function() {});

      // Client list (name, color, contacts) for previews
      fetch('/clients.json')
        .then(function(r) { return r.json(); })
        .then(function(clients) { window.CLIENTS = clients; })
        .catch(function() {});

      function slugify(str) {
        if (!str) return '';
        return str.replace(/['''\u2018\u2019`]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
      }

      window.addEventListener('load', function() {
        if (!window.CMS) return;

        window.CMS.registerEventListener({
          name: 'preSave',
          handler: function(args) {
            var entry = args.entry;
            var data = entry.get('data');
            var title = data.get('title');
            var collection = entry.get('collection');

            // Duplicate title check (blog posts only)
            if (title && collection === 'blog') {
              var newTitleSlug = slugify(title);
              var currentFileSlug = entry.get('slug');

              var duplicate = knownPosts.find(function(p) {
                return slugify(p.title) === newTitleSlug && p.slug !== currentFileSlug;
              });

              if (duplicate) {
                throw new Error(
                  'A task with a very similar title already exists: "' + duplicate.title + '". ' +
                  'Duplicate titles cause URL conflicts — please use a different title.'
                );
              }
            }

            // Status action (blog posts only): keep tags + completedDate in sync
            // with the editor-facing `status` field (open | done | wontdo)
            if (collection === 'blog') {
              var tags = data.get('tags');
              if (tags && tags.toJS) { tags = tags.toJS(); }
              if (!Array.isArray(tags)) { tags = ['post']; }

              var today = new Date().toISOString().split('T')[0];
              var status = data.get('status');

              if (status === 'done') {
                if (tags.indexOf('completed') === -1 && tags.indexOf('complete') === -1) {
                  tags.push('completed');
                }
                tags = tags.filter(function(t) { return t !== 'wontdo'; });
                data = data.set('tags', tags);
                if (!data.get('completedDate')) {
                  data = data.set('completedDate', today);
                }
              } else if (status === 'wontdo') {
                if (tags.indexOf('wontdo') === -1) {
                  tags.push('wontdo');
                }
                tags = tags.filter(function(t) { return t !== 'completed' && t !== 'complete'; });
                data = data.set('tags', tags);
                data = data.delete('completedDate');
              } else {
                // open — strip any completion / wontdo markers
                tags = tags.filter(function(t) { return t !== 'completed' && t !== 'complete' && t !== 'wontdo'; });
                data = data.set('tags', tags);
                data = data.delete('completedDate');
              }

              // status stays in the file — it's the field the editor displays
            }

            return data;
          }
        });
      });
    })();
    </script>
  </body>
</html>
