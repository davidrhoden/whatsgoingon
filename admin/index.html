<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Decap CMS</title>
  </head>
  <body>
    <!-- Include the script that builds the page and powers Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <!-- Include Netlify Identity for authentication -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script type="module" src="/admin/preview-templates/index.js"></script>
    <script>
    (function() {
      var knownPosts = [];

      fetch('/post-slugs.json')
        .then(function(r) { return r.json(); })
        .then(function(posts) { knownPosts = posts; })
        .catch(function() {});

      function slugify(str) {
        if (!str) return '';
        return str.replace(/['''\u2018\u2019`]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
      }

      window.addEventListener('load', function() {
        if (!window.CMS) return;

        window.CMS.registerEventListener({
          name: 'preSave',
          handler: function(args) {
            var entry = args.entry;
            var data = entry.get('data');
            var title = data.get('title');
            var collection = entry.get('collection');

            // Duplicate title check (blog posts only)
            if (title && collection === 'blog') {
              var newTitleSlug = slugify(title);
              var currentFileSlug = entry.get('slug');

              var duplicate = knownPosts.find(function(p) {
                return slugify(p.title) === newTitleSlug && p.slug !== currentFileSlug;
              });

              if (duplicate) {
                throw new Error(
                  'A task with a very similar title already exists: "' + duplicate.title + '". ' +
                  'Duplicate titles cause URL conflicts — please use a different title.'
                );
              }
            }

            // Mark as Done action (blog posts only)
            if (collection === 'blog') {
              var tags = data.get('tags');
              if (tags && tags.toJS) { tags = tags.toJS(); }
              if (!Array.isArray(tags)) { tags = ['post']; }

              var hasCompleted = tags.indexOf('completed') !== -1 || tags.indexOf('complete') !== -1;
              var today = new Date().toISOString().split('T')[0];

              if (data.get('markDone') === true && !hasCompleted) {
                tags.push('completed');
                hasCompleted = true;
                data = data.set('tags', tags);
              }

              if (hasCompleted) {
                // Ensure completed tasks always have a completion date
                if (!data.get('completedDate')) {
                  data = data.set('completedDate', today);
                }
              } else {
                // Strip completedDate from tasks that aren't done
                data = data.delete('completedDate');
              }

              // Don't persist markDone to the file
              data = data.delete('markDone');

              // Mark as Won't Do (blog posts only) — only ever adds, mirrors markDone
              var hasWontdo = tags.indexOf('wontdo') !== -1;
              if (data.get('markWontdo') === true) {
                if (!hasWontdo) {
                  tags.push('wontdo');
                  data = data.set('tags', tags);
                }
                // Won't Do supersedes Done — drop the done markers
                if (hasCompleted) {
                  tags = tags.filter(function(t) {
                    return t !== 'completed' && t !== 'complete';
                  });
                  data = data.set('tags', tags);
                  data = data.delete('completedDate');
                }
              }

              // Don't persist markWontdo to the file
              data = data.delete('markWontdo');
            }

            return data;
          }
        });
      });
    })();
    </script>
  </body>
</html>
