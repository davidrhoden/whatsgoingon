<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Netlify CMS</title>
  </head>
  <body>
    <!-- Include the script that builds the page and powers Netlify CMS -->
    <script src="https://unpkg.com/netlify-cms@2.15.72/dist/netlify-cms.js"></script>
    <!-- Include Netlify Identity for authentication -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script type="module" src="/admin/preview-templates/index.js"></script>
    <script>
    (function() {
      var knownPosts = [];

      fetch('/post-slugs.json')
        .then(function(r) { return r.json(); })
        .then(function(posts) { knownPosts = posts; })
        .catch(function() {});

      function slugify(str) {
        if (!str) return '';
        return str.replace(/['''\u2018\u2019`]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
      }

      window.addEventListener('load', function() {
        if (!window.CMS) return;

        window.CMS.registerEventListener({
          name: 'preSave',
          handler: function(args) {
            var entry = args.entry;
            var title = entry.getIn(['data', 'title']);
            var collection = entry.get('collection');

            // Duplicate title check (blog posts only)
            if (title && collection === 'blog') {
              var newTitleSlug = slugify(title);
              var currentFileSlug = entry.get('slug');

              var duplicate = knownPosts.find(function(p) {
                return slugify(p.title) === newTitleSlug && p.slug !== currentFileSlug;
              });

              if (duplicate) {
                throw new Error(
                  'A task with a very similar title already exists: "' + duplicate.title + '". ' +
                  'Duplicate titles cause URL conflicts — please use a different title.'
                );
              }
            }

            // Mark as Done action (blog posts only)
            if (collection === 'blog') {
              var tags = entry.getIn(['data', 'tags']);
              if (tags && tags.toJS) { tags = tags.toJS(); }
              if (!Array.isArray(tags)) { tags = ['post']; }

              var hasCompleted = tags.indexOf('completed') !== -1 || tags.indexOf('complete') !== -1;
              var today = new Date().toISOString().split('T')[0];

              if (entry.getIn(['data', 'markDone']) === true && !hasCompleted) {
                tags.push('completed');
                entry = entry.setIn(['data', 'tags'], tags);
              }

              if (hasCompleted) {
                // Ensure completed tasks always have a completion date
                if (!entry.getIn(['data', 'completedDate'])) {
                  entry = entry.setIn(['data', 'completedDate'], today);
                }
              } else {
                // Strip completedDate from tasks that aren't done
                entry = entry.setIn(['data', 'completedDate'], undefined);
              }

              // Don't persist markDone to the file
              entry = entry.setIn(['data', 'markDone'], undefined);
            }

            return entry;
          }
        });
      });
    })();
    </script>
  </body>
</html>
